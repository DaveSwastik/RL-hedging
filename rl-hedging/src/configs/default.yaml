# ---------------------------
# Environment & Simulator
# ---------------------------
environment:
  trading_cost: 0.0002        # per-dollar traded cost (2 bps) — used by env and training
  seed: 42
  device: "auto"              # "auto" -> script chooses cuda if available

# ADD THIS: 3x3 Transition Matrix for your 3 regimes
  # Row 0 (LowVol): 94% stay, 5% go to HighVol, 1% go to Crisis
  # Row 1 (HighVol): 10% go to LowVol, 85% stay, 5% go to Crisis
  # Row 2 (Crisis): 5% go to LowVol, 15% go to HighVol, 80% stay

simulator:
  steps: 30                   # episode length (days). set 30 for the "memory window" you wanted
  dt: 0.00396825396                   # daily timestep (approx), used by env
  S0: 100.0
  V0: 0.2

  trans_mat: 
    - [0.94, 0.05, 0.01]
    - [0.10, 0.85, 0.05]
    - [0.05, 0.15, 0.80]
  regimes:
    - name: "LowVol"
      prob: 0.94
      mu: 0.0
      theta: 0.04    # Long-term variance (20% vol squared)
      kappa: 2.0     # Fast mean reversion
      sigma_v: 0.1   # Low vol-of-vol
    - name: "HighVol"
      prob: 0.05
      mu: 0.0
      theta: 0.09    # Long-term variance (30% vol squared)
      kappa: 1.0     # Slower mean reversion
      sigma_v: 0.3   # High vol-of-vol
    - name: "Crisis"
      prob: 0.01
      mu: -0.05
      theta: 0.25    # Long-term variance (50% vol squared)
      kappa: 0.5     # Very slow recovery
      sigma_v: 0.5   # Extreme vol-of-vol

# ---------------------------
# Option / Hedging Instrument
# ---------------------------
option:
  type: "asian"               # matches your planned path-dependent option (memory matters)
  K: 100.0
  maturity_years: 0.08        # fraction of year
  notional: 1.0
  payoff: "call"              # or "put"
  include_delta_feature: false

# ---------------------------
# Agent / Model hyperparameters
# ---------------------------
model:
  agent_type: "ERARL_Agent_V2"
  obs_dim: null               # auto-filled at runtime from env.observation_space
  hidden_dim: 128
  num_quantiles: 32
  num_modes: 3
  action_dim: 1               # scalar hedge ratio (keep 1 for your single underlying)
  encoder:
    gru_num_layers: 1
    gru_bidirectional: false

# ---------------------------
# Training schedule & optimizers
# ---------------------------
training:
  n_episodes: 1000            # default training length (override for smoke tests)
  seq_len: 30                 # sliding window length fed to encoder (match simulator.steps)
  gamma: 0.99

  # phases roughly match the script: fractions of n_episodes

  # currently taking hardcioded values from training script
  phases:
    phase1_frac: 0.15         # FORCED_ENTRY
    phase2_frac: 0.60         # STABILIZATION
    phase3_frac: 0.25
    # MASTERY implied as remaining fraction

  # per-phase hyperparameters (used to construct schedules in train script)
  phase_settings:
    FORCED_ENTRY:
      cost_multiplier: 0.0
      entropy_coef: 0.05
      shock_prob: 0.0
    STABILIZATION:
      cost_multiplier: 1.0
      entropy_coef: 0.01
      shock_prob: 0.05
    MASTERY:
      cost_multiplier: 1.0
      entropy_coef: 0.005
      shock_prob: 0.15

  # optimizer learning rates (mapped to parameters in your script)
  optimizer:
    type: "adam"
    encoder_lr: 3e-4
    actor_lr: 1e-4
    critic_body_lr: 3e-4
    critic_uncertainty_lr: 3e-4
    tail_lr: 5e-5
    grad_clip_norm: 0.5

# ---------------------------
# Tail & EVT (GPD) training
# ---------------------------
tail:
  enabled: true
  buffer_maxlen: 2000
  min_buffer_for_update: 64
  batch_size: 64
  update_every_episodes: 10   # run a tail update every N episodes (as in your script)
  xi_clamp: [-0.999, 0.999]
  sigma_min: 1e-6
  small_xi_threshold: 1e-6

# ---------------------------
# Logging, saving, evaluation
# ---------------------------
logging:
  training_log_path: "training_log_v2.csv"
  episode_summary_path: "episode_summaries.csv"
  save_model_path: "models/era_rl_v2.pth"
  save_every_episodes: 100
  generate_dashboard: true
  dashboard_path: "training_mastery_report.png"

# ---------------------------
# Reward & evaluation
# ---------------------------
reward:
  fn: "squared_error"         # default: squared hedging replication error (your script)
  include_trading_costs: true

evaluation:
  run_after_training: true
  eval_seed: 123
  eval_episodes: 1
  record_history: true        # collects prices, deltas, actions, modes, xis for dashboard

# ---------------------------
# Misc / debug
# ---------------------------
misc:
  seed: 42
  smoke_test:
    enabled: true
    n_episodes: 5             # override n_episodes for quick smoke runs
    seq_len: 10               # shorter sequence for smoke tests
