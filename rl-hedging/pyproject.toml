# pyproject.toml
[tool.poetry]
name = "rl-hedging"
version = "0.1.0"
description = "RL for hedging path-dependent options"
authors = ["Swastik Dave <svastikdave@gmail.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
numpy = "^1.26.1"
pandas = "^2.1.2"
torch = "^2.1.0"
stable-baselines3 = {extras = ["extra"], version = "^2.1.0"}
gymnasium = "^0.29.1"
scipy = "^1.11.3"
numba = "^0.58.1"
scikit-learn = "^1.3.2"
matplotlib = "^3.8.0"
plotly = "^5.17.0"
pyyaml = "^6.0.1"
shap = "^0.43.0"
tqdm = "^4.66.1"
seaborn = "^0.13.2"
yfinance = "^0.2.66"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)"
]
